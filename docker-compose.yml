services:
  postgres:
    image: postgres:16-alpine
    container_name: event-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_system
    ports:
      - "5432:5432"
    volumes:
      - event-system-pgdata:/var/lib/postgresql/data

volumes:
  event-system-pgdata:
